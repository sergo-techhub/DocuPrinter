name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Docker Hub login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: GitHub Container Registry login
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'change version'
      run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

    - uses: docker/setup-buildx-action@v4

    - name: Build and push the Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          sergogmbh/docuprinter:${{ github.ref_name }}
          sergogmbh/docuprinter:latest
          ghcr.io/${{ github.repository_owner }}/docuprinter:${{ github.ref_name }}
          ghcr.io/${{ github.repository_owner }}/docuprinter:latest

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "Release $GITHUB_REF_NAME" \
          --notes "Please check [README](https://github.com/${{ github.repository }}/blob/main/README.md) to see how you can use this project."
